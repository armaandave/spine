name: Deploy Backend on Desk Mac

# CI (ci.yml) calls this for every push to myapp-main that passes its checks. Run it
# by hand to deploy a branch's tip, or set ref to deploy an older commit of that
# branch, for example to roll back.
on:
  workflow_call:
    inputs:
      ref:
        description: "Commit to deploy: the myapp-main push CI just checked."
        required: true
        type: string
  workflow_dispatch:
    inputs:
      branch:
        description: "Git branch to deploy. Leave blank to deploy the selected workflow branch."
        required: false
        default: ""
        type: string
      ref:
        description: "Commit on that branch to deploy instead of its tip, for example to roll back."
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy backend
    runs-on: [self-hosted, spine-backend]
    # Shared with every workflow that changes production, so they never overlap.
    concurrency:
      group: spine-production-mutation
      cancel-in-progress: false
    steps:
      - name: Checkout deploy workflow branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Manual runs always deploy. A push deploys only while it is still the tip of its
      # branch (a late older run must not undo a newer deploy) and only when it changes
      # something the backend image is built from.
      - name: Decide whether to deploy
        id: plan
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REQUESTED_BRANCH: ${{ inputs.branch }}
          REQUESTED_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          branch="${REQUESTED_BRANCH:-$GITHUB_REF_NAME}"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "ref=$REQUESTED_REF" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT" != "push" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          deploy_repo="$HOME/projects/spine-deploy"
          git -C "$deploy_repo" fetch --quiet origin "+refs/heads/$branch:refs/remotes/origin/$branch"
          tip="$(git -C "$deploy_repo" rev-parse "origin/$branch")"
          if [[ "$tip" != "$REQUESTED_REF" ]]; then
            echo "Not deploying: $branch has moved on to ${tip:0:8}, and that push deploys itself."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          deployed="$(docker exec spine printenv SPINE_COMMIT_SHA 2>/dev/null || true)"
          if [[ -n "$deployed" ]] && git -C "$deploy_repo" cat-file -e "$deployed^{commit}" 2>/dev/null \
            && git -C "$deploy_repo" diff --quiet "$deployed" "$REQUESTED_REF" -- \
              src Dockerfile .dockerignore docker-compose.production.yml entrypoint.sh \
              supervisord.conf nginx.conf pyproject.toml uv.lock \
              scripts/codex-mobile-deploy-backend.sh scripts/verify-real-client-ip.sh \
              .github/workflows/deploy-backend-desk-mac.yml; then
            echo "Not deploying: nothing the backend is built from changed since the deployed ${deployed:0:8}."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - name: Back up production before deployment
        if: steps.plan.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d "$HOME/projects/spine-deploy/.git" ]]; then
            git -C "$HOME/projects/spine-deploy" diff --quiet
            git -C "$HOME/projects/spine-deploy" diff --cached --quiet
          fi
          umask 077
          backup_dir="$HOME/projects/spine-backups"
          mkdir -p "$backup_dir"
          backup="$backup_dir/pre-deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.dump"
          set -o noclobber
          docker exec spine-db pg_dump -U spine -d spine -Fc > "$backup"
          test -s "$backup"
          docker exec -i spine-db pg_restore --list < "$backup" > /dev/null
          echo "Verified database backup: $backup"

      - name: Deploy
        if: steps.plan.outputs.deploy == 'true'
        shell: bash
        env:
          BRANCH: ${{ steps.plan.outputs.branch }}
          REF: ${{ steps.plan.outputs.ref }}
        run: ./scripts/codex-mobile-deploy-backend.sh "$BRANCH" ${REF:+"$REF"}

      - name: Verify deployment and clear old cache
        if: steps.plan.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors https://api.spine-api.com/api/v1/health/
          expected_sha="$(git -C "$HOME/projects/spine-deploy" rev-parse HEAD)"
          deployed_sha="$(docker exec spine printenv SPINE_COMMIT_SHA)"
          [[ "$deployed_sha" == "$expected_sha" ]]
          docker exec spine python manage.py migrate --check
          # Only the cache's own keys: clearing the cache flushes the whole Redis DB, which
          # also holds Celery's queue and the provider quota counters.
          docker exec spine python manage.py shell -c 'from django.core.cache import cache; cache.delete_pattern("*")'
          curl --fail --silent --show-error https://api.spine-api.com/api/v1/health/
