name: CI

# Every push to any branch runs the checks. A push to myapp-main that passes them
# deploys production when it changes what the backend is built from
# (deploy-backend-desk-mac.yml decides).
on:
  push:
  workflow_dispatch:

# A newer push to the same branch cancels the older run. Each push to myapp-main gets
# its own group, so every production commit gets a result and no deploy is cut short.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/myapp-main' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Fast checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      # Pinned to a commit because it is a third-party action.
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.12"
      # Lint and models without a migration. The test suite runs once here, on Postgres
      # like production (Database checks); the ship line already ran it on SQLite
      # (scripts/check.sh) on the merged commit before the push.
      - name: Lint
        run: uv run --locked ruff check src
      - name: Models without a migration
        working-directory: src
        run: uv run --locked python manage.py makemigrations --check --dry-run

  database:
    name: Database checks
    runs-on: ubuntu-latest
    timeout-minutes: 50
    services:
      # Production runs postgres:16-alpine (docker-compose.production.yml).
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: spine
          POSTGRES_USER: spine
          POSTGRES_PASSWORD: spine-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spine -d spine"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    # Setting DB_HOST switches settings.py from SQLite to Postgres.
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: spine
      DB_USER: spine
      DB_PASSWORD: spine-ci
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.12"
      # Tests don't need crash safety: skip waiting for the disk on every commit. Test-only
      # settings for this throwaway server, not production's.
      - name: Make Postgres fast for tests
        env:
          PGPASSWORD: spine-ci
        run: |
          psql -h 127.0.0.1 -U spine -d spine -v ON_ERROR_STOP=1 \
            -c "ALTER SYSTEM SET fsync = off" \
            -c "ALTER SYSTEM SET synchronous_commit = off" \
            -c "ALTER SYSTEM SET full_page_writes = off" \
            -c "SELECT pg_reload_conf()"
          psql -h 127.0.0.1 -U spine -d spine -Atc "SHOW fsync; SHOW synchronous_commit; SHOW full_page_writes"
      # What every deploy does when the new container starts (entrypoint.sh).
      - name: Apply every migration to an empty database
        run: uv run --locked python manage.py migrate --noinput
      # The suite has hung here before, until the job's time limit cut it off with no
      # clue. If it's still running at 25 and 40 minutes, print what Postgres is waiting on
      # and each test process's Python stack (which test, which line), then carry on.
      - name: Tests on Postgres
        env:
          PGPASSWORD: spine-ci
        run: |
          report() {
            echo "::group::Still running after $1 minutes: Postgres sessions"
            psql -h 127.0.0.1 -U spine -d spine -c "SELECT pid, datname, state, wait_event_type, wait_event, now() - query_start AS running_for, left(query, 300) AS query FROM pg_stat_activity WHERE datname LIKE 'test_%' ORDER BY query_start" || true
            echo "::endgroup::"
            echo "::group::Still running after $1 minutes: test processes"
            uv tool install --quiet py-spy >/dev/null 2>&1 || true
            for pid in $(pgrep -f "manage.py test"); do
              echo "--- process $pid"
              sudo "$HOME/.local/bin/py-spy" dump --pid "$pid" || true
            done
            echo "::endgroup::"
          }
          ( sleep 1500 && report 25 && sleep 900 && report 40 ) &
          watchdog=$!
          status=0
          uv run --locked python manage.py test --parallel 4 --noinput || status=$?
          pkill -P "$watchdog" 2>/dev/null || true
          kill "$watchdog" 2>/dev/null || true
          exit "$status"

  deploy:
    name: Deploy production
    needs: [checks, database]
    if: github.event_name == 'push' && github.ref == 'refs/heads/myapp-main'
    uses: ./.github/workflows/deploy-backend-desk-mac.yml
    with:
      ref: ${{ github.sha }}
