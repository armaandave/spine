{% load app_tags %}

<div class="mt-6">
  <div class="flex items-center justify-between mb-4">
    <div class="flex items-center">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 text-yellow-400 mr-2">
        <path d="M10 14.66v1.626a2 2 0 0 1-.976 1.696A5 5 0 0 0 7 21.978"/>
        <path d="M14 14.66v1.626a2 2 0 0 0 .976 1.696A5 5 0 0 1 17 21.978"/>
        <path d="M18 9h1.5a1 1 0 0 0 0-5H18"/>
        <path d="M4 22h16"/>
        <path d="M6 9a6 6 0 0 0 12 0V3a1 1 0 0 0-1-1H7a1 1 0 0 0-1 1z"/>
        <path d="M6 9H4.5a1 1 0 0 1 0-5H6"/>
      </svg>
      <h3 class="text-lg font-medium">Hall of Fame</h3>
    </div>
  </div>
  
  <div id="hof-grid" class="grid grid-cols-4 sm:grid-cols-8 gap-4">
    {% get_exposed_hall_of_fame_items user as hof_items %}
    {% for item in hof_items %}
      <div class="relative">
        {% include "app/components/media_card.html" with media=item.media item=item title=item.title from_grid=True hof_display=True %}
      </div>
    {% endfor %}
  </div>
</div>
