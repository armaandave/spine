user abc;
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Real client IP.
    # Path: visitor -> Cloudflare -> cloudflared (on the host Mac) ->
    # 127.0.0.1:8000 (published port, loopback only) -> Docker Desktop -> nginx.
    # Docker Desktop delivers every one of those connections from the gateway
    # of the compose network (172.N.0.1, measured), so without this every
    # visitor would share a single $remote_addr. Cloudflare puts the visitor's
    # address in CF-Connecting-IP; honour it ONLY when the TCP peer is inside
    # 172.16.0.0/12 (where Docker allocates new networks first), and never when
    # it arrives from anywhere else.
    #
    # Not trusted, on purpose:
    # - 192.168.65.0/24. Docker Desktop shows that address for ports published on
    #   non-loopback interfaces (a plain "8000:8000" mapping), where LAN clients
    #   look the same as the tunnel. If the 127.0.0.1 binding in
    #   docker-compose.production.yml is ever removed, spoofed CF-Connecting-IP
    #   headers are then ignored instead of trusted.
    # - the rest of 192.168.0.0/16. Docker's default pools also hand out /20s
    #   from it once the 172.x networks are used up. A compose network that lands
    #   there fails closed: every visitor shares one address. The post-deploy
    #   check (scripts/verify-real-client-ip.sh) reports it; then add that
    #   network's subnet here.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;

    # $remote_addr below is the real client IP after the realip step above.
    # peer= is the address that actually connected (the Docker gateway); if it
    # equals the client IP, CF-Connecting-IP was not trusted for that request.
    # cf_ray correlates a line with the Cloudflare dashboard/logs.
    log_format spine '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                     'rt=$request_time urt="$upstream_response_time" '
                     'cf_ray="$http_cf_ray" peer=$realip_remote_addr';

    access_log /dev/stdout spine;

    sendfile on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 20M;
    client_body_buffer_size 256k;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    upstream app_server {
        server 127.0.0.1:8001;
    }

    server {
        listen 8000;
        server_name _;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # Proxy to Gunicorn.
        # X-Forwarded-For is REPLACED with the real client IP only, never
        # appended to. Cloudflare appends to whatever XFF the client sent, and
        # DRF throttles (NUM_PROXIES unset) key on the whole XFF string, so
        # forwarding the incoming value would let a client dodge throttles by
        # changing a fake prefix. allauth reads X-Real-IP.
        location / {
            proxy_pass http://app_server;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        location /health/ {
            access_log off;
            proxy_pass http://app_server;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # Static files
        location /static/ {
            alias /yamtrack/staticfiles/;
            expires 30d;
            add_header Cache-Control "public";
        }

        # User uploads (profile pictures, etc.)
        location /media/ {
            alias /yamtrack/media/;
            expires 7d;
            add_header Cache-Control "public";
        }

    }
}